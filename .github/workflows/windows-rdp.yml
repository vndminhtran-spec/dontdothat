# =====================================================================
#  Windows Cloud RDP - 90-day "CHAIN"  (v3 - logic tested)
# ---------------------------------------------------------------------
#  How it works: a GitHub-hosted job can live max 6 h, so each run
#  HANDS THE BATON - it triggers the next run via the GitHub API,
#  then `tailscale logout`s to free the name for the successor.
#  Same Tailscale name "github-rdp-server" stays reachable 24/7.
#
#  IMPORTANT: never paste any token into this file.
#  The script uses the built-in GITHUB_TOKEN environment variable.
#
#  Requirements (same as the original 6h version):
#    - repo + secret TAILSCALE_AUTHKEY
#    - the auth key must allow "use more than once / multiple devices"
#  Stop early: run the "Windows RDP - STOP" workflow.
# =====================================================================
name: Windows Cloud RDP (90d chain)

on:
  workflow_dispatch:
    inputs:
      deadline:
        description: "Chain end time, UTC (empty = now + 90 days), e.g. 2026-12-07T00:00:00Z"
        type: string
        default: ""

concurrency:
  group: windows-rdp-chain
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    permissions:
      actions: write
    env:
      DEADLINE_IN: ${{ github.event.inputs.deadline }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      REF: ${{ github.ref_name }}
      API: https://api.github.com

    steps:
      - name: 1. Resolve chain deadline
        run: |
          $in = ([string]$env:DEADLINE_IN).Trim()
          if ($in -eq "") {
            $d = (Get-Date).AddDays(90)
            Write-Host "No deadline given -> now + 90 days"
          } else {
            try { $d = [datetime]::Parse($in) }
            catch { $d = [datetime]::ParseExact($in, "yyyy-MM-ddTHH:mm:ssZ", [System.Globalization.CultureInfo]::InvariantCulture) }
          }
          $iso = $d.ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $iso | Out-File -FilePath "$env:GITHUB_WORKSPACE/.deadline" -Encoding ascii -NoNewline
          Write-Host "Chain runs until: $iso (UTC)"

      - name: 2. Verify GitHub API token (handoff depends on it)
        run: |
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          try {
            $me = Invoke-RestMethod -Uri "$env:API/user" -Headers $h
            Write-Host "GitHub API OK - authenticated as $($me.login)"
          } catch {
            Write-Host "============================================" -ForegroundColor Red
            Write-Host " GitHub API auth FAILED (401 Bad credentials)" -ForegroundColor Red
            Write-Host " The chain cannot hand off runs without a valid" -ForegroundColor Red
            Write-Host " GITHUB_TOKEN. Check these three things:" -ForegroundColor Red
            Write-Host "  1. This file must use `$env:GITHUB_TOKEN internally." -ForegroundColor Red
            Write-Host "     If you pasted a token anywhere in the file, remove it." -ForegroundColor Red
            Write-Host "  2. Repo -> Settings -> Actions -> General ->" -ForegroundColor Red
            Write-Host "     'Workflow permissions' = 'Read and write'." -ForegroundColor Red
            Write-Host "  3. Start the run from the Actions tab (default branch)," -ForegroundColor Red
            Write-Host "     not from a fork or a pull request." -ForegroundColor Red
            Write-Host "============================================" -ForegroundColor Red
            exit 1
          }

      - name: 3. Cancel sibling runs (warning only, keeps single chain)
        run: |
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          try {
            $runs = Invoke-RestMethod -Uri "$env:API/repos/$env:REPO/actions/runs?status=in_progress,queued&per_page=100" -Headers $h
            $found = $false
            foreach ($r in $runs.workflow_runs) {
              if ([string]$r.id -ne [string]$env:RUN_ID) {
                $found = $true
                Write-Host "Cancelling sibling run $($r.id) ($($r.name))"
                Invoke-RestMethod -Method Post -Uri "$env:API/repos/$env:REPO/actions/runs/$($r.id)/cancel" -Headers $h | Out-Null
              }
            }
            if (-not $found) { Write-Host "No other runs active or queued." }
          } catch {
            Write-Host "WARNING: could not check sibling runs: $_" -ForegroundColor Yellow
            Write-Host "Continuing anyway. Avoid pressing 'Run' manually while the chain is active." -ForegroundColor Yellow
          }

      - name: 4. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 5. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 6. Install & Connect Tailscale (same name every time)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
          if (-not $ts_ip) {
            Write-Host "Tailscale is NOT connected (no IP)." -ForegroundColor Red
            Write-Host "Most common cause: the auth key is single-use. Create a key" -ForegroundColor Red
            Write-Host "with 'Allow this key to be used more than once' and update the" -ForegroundColor Red
            Write-Host "TAILSCALE_AUTHKEY secret, then press Run again." -ForegroundColor Red
            exit 1
          }
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY (this run) <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale name : github-rdp-server" -ForegroundColor Yellow
          Write-Host "  Tailscale IP   : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username       : CynetAdmin" -ForegroundColor Yellow
          Write-Host "  Password       : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >> mstsc -> github-rdp-server.<your-tailnet>.ts.net" -ForegroundColor Magenta
          Write-Host "  >> (the IP above belongs to THIS run only)" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 7. Keep alive (~5.5 h, inside the 6 h cap)
        run: |
          $deadline = [datetime]::ParseExact((Get-Content "$env:GITHUB_WORKSPACE/.deadline").Trim(), "yyyy-MM-ddTHH:mm:ssZ", [System.Globalization.CultureInfo]::InvariantCulture)
          $maxEnd = (Get-Date).AddMinutes(330)
          $end = if ($deadline -lt $maxEnd) { $deadline } else { $maxEnd }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $i = 0
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 300
            $i++
            $ip = & $ts ip -4 2>$null
            if ($ip) {
              Write-Host "[$i] $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC - ONLINE  ip=$ip"
            } else {
              Write-Host "[$i] $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC - OFFLINE, reconnecting..." -ForegroundColor Red
              & $ts up --hostname="github-rdp-server" 2>&1 | Out-Host
            }
          }
          Write-Host "Keep-alive phase finished at $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"

      - name: 8. Hand off to the next run (the chain)
        run: |
          $h = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          $deadlineIso = (Get-Content "$env:GITHUB_WORKSPACE/.deadline").Trim()
          $deadline = [datetime]::ParseExact($deadlineIso, "yyyy-MM-ddTHH:mm:ssZ", [System.Globalization.CultureInfo]::InvariantCulture)

          if ((Get-Date) -ge $deadline) {
            Write-Host "Deadline reached - the chain ends here." -ForegroundColor Yellow
            & "C:\Program Files\Tailscale\tailscale.exe" logout
            exit 0
          }

          $payload = @{ ref = $env:REF; inputs = @{ deadline = $deadlineIso } } | ConvertTo-Json -Depth 5
          try {
            Invoke-RestMethod -Method Post -Uri "$env:API/repos/$env:REPO/actions/workflows/windows-rdp.yml/dispatches" -Headers $h -Body $payload -ContentType "application/json" | Out-Null
            Write-Host "Next run triggered - it starts right after this one ends." -ForegroundColor Cyan
          } catch {
            Write-Host "FAILED to trigger the next run: $_" -ForegroundColor Red
            Write-Host "Chain is broken - press 'Run workflow' again to resume." -ForegroundColor Red
            exit 1
          }

          # Remove our node so the successor can take over the same name
          & "C:\Program Files\Tailscale\tailscale.exe" logout
          Write-Host "Handed off. This run is done." -ForegroundColor Green
